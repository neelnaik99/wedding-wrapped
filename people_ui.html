<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>People — Wedding Wrapped</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1a1a19;--muted:#6b6963;--line:#e4e1d8;--acc:#b8862b;--ok:#1b8f5a;--warn:#c8462f;--hi:#fff4d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:600}header a{color:var(--acc);text-decoration:none;font-size:13px}
.f{display:flex;gap:6px;flex-wrap:wrap}.f button{font:inherit;font-size:13px;padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer}.f button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;min-width:220px}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}.tools button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
table{border-collapse:collapse;width:100%;background:var(--panel)}th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:52px;background:var(--panel);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;z-index:4}th.s::after{content:" ↓"}
td img{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;cursor:zoom-in}
td.name input{font:inherit;width:220px;padding:5px 8px;border:1px solid transparent;border-radius:6px;background:transparent}td.name input:hover,td.name input:focus{border-color:var(--line);background:#fff;outline:none}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px}.st.l{background:#e6f5ec;color:#125c3a}.st.p{background:var(--hi);color:#7a5a12}.st.n{background:#fbe9e5;color:#7a2416}.st.m{background:#e8e8f7;color:#3b3b8a}.st.u{background:var(--bg);color:var(--muted)}
.dup{color:var(--warn);font-size:11px}.act button{font:inherit;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;margin-right:4px}
.ev{font-size:11px;color:var(--muted)}#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:50;align-items:center;justify-content:center}#lb.on{display:flex}#lb img{max-width:96vw;max-height:94vh}
</style></head><body>
<header><h1>People</h1><a href="/">← namer</a><a href="/review">review</a>
 <div class=f id=filters><button data-f=all class=on>All</button><button data-f=unlabeled>Unlabeled</button><button data-f=labeled>Named</button><button data-f=provisional>Provisional</button><button data-f=dup>Duplicates</button><button data-f=not_guest>Not a guest</button><button data-f=merged>Merged</button></div>
 <input type=search id=q placeholder="search name / #id / email">
 <div class=tools><span id=sum></span><button id=undo>Undo last</button><a href="/api/export.csv"><button>Export CSV</button></a><button id=imp>Import CSV…</button><input type=file id=file accept=".csv" style="display:none"><a href="/api/history" target=_blank>history</a></div>
</header>
<table><thead><tr><th></th><th data-k=cid>#</th><th data-k=photos class=s>Photos</th><th>Events</th><th data-k=status>Status</th><th data-k=name>Name (type to change)</th><th>Email</th><th>Household</th><th>Actions</th></tr></thead><tbody id=tb></tbody></table>
<datalist id=gl></datalist><div id=msg></div><div id=lb onclick="this.classList.remove('on')"><img id=lbimg></div>
<script>
let R=[],G=[],filter='all',sortK='photos',sortD=-1;const $=id=>document.getElementById(id);
const EV={"GREH SHANTI":"GS",HALDI:"H",SANGEET:"S",WEDDING:"W","RECEPTION PARTY":"R","RECEPTION COUPLE":"Rc","BRIDE MORNING":"Bm","GROOM MORNING":"Gm","COUPLE SHOOT":"Cs"};
function msg(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(m.t);m.t=setTimeout(()=>m.style.display='none',2200)}
async function load(){const d=await (await fetch('/api/people')).json();R=d.rows;G=d.guests;$('gl').innerHTML=G.map(g=>'<option value="'+g.name.replace(/"/g,'&quot;')+'">'+(g.email||'')+'</option>').join('');render()}
function stat(l){if(!l||!l.status&&!l.name)return 'unlabeled';if(l.status==='not_guest')return 'not_guest';if(l.status==='merged')return 'merged';return l.provisional?'provisional':'labeled'}
function dups(){const m={};R.forEach(r=>{const g=r.label&&r.label.guest_id;if(g!=null)(m[g]=m[g]||[]).push(r.cid)});return m}
function render(){const D=dups(),q=$('q').value.trim().toLowerCase();
 let rows=R.filter(r=>{const s=stat(r.label);if(filter==='dup')return r.label&&r.label.guest_id!=null&&D[r.label.guest_id].length>1;if(filter!=='all'&&s!==filter)return false;
  if(q){const l=r.label||{};return ('#'+r.cid).includes(q)||(l.name||'').toLowerCase().includes(q)||(l.email||'').toLowerCase().includes(q)}return true});
 rows.sort((a,b)=>{const va=sortK==='status'?stat(a.label):sortK==='name'?((a.label||{}).name||'~'):a[sortK],vb=sortK==='status'?stat(b.label):sortK==='name'?((b.label||{}).name||'~'):b[sortK];return (va>vb?1:va<vb?-1:0)*sortD});
 $('tb').innerHTML=rows.map(r=>{const l=r.label||{},s=stat(l),d=l.guest_id!=null&&D[l.guest_id].length>1?D[l.guest_id].filter(c=>c!==r.cid):[];
  return '<tr data-c="'+r.cid+'"><td><img src="'+r.face+'" onclick="lb(this.src)"></td><td><a href="/?cid='+r.cid+'" style="color:var(--acc)">#'+r.cid+'</a></td><td>'+r.photos+'</td><td class=ev>'+Object.entries(r.events).sort((a,b)=>b[1]-a[1]).map(([e,n])=>(EV[e]||e)+' '+n).join(' · ')+'</td>'+
  '<td><span class="st '+s[0]+'">'+s.replace('_',' ')+'</span>'+(d.length?'<div class=dup>also #'+d.join(', #')+'</div>':'')+'</td>'+
  '<td class=name><input list=gl value="'+(s==='not_guest'||s==='merged'?'':(l.name||'')).replace(/"/g,'&quot;')+'" placeholder="'+(s==='merged'?'merged into #'+l.merge_into:s==='not_guest'?'—':'type a name…')+'" onchange="setName('+r.cid+',this.value)"></td>'+
  '<td>'+(l.email||'')+'</td><td title="'+(l.party||'')+'">'+(l.party?l.party.split('-').slice(5).join(' ')||l.party.slice(0,8):'')+'</td>'+
  '<td class=act><button onclick="notGuest('+r.cid+')">not a guest</button><button onclick="clearL('+r.cid+')">clear</button>'+(s==='provisional'?'<button onclick="confirmL('+r.cid+')">confirm</button>':'')+'</td></tr>'}).join('');
 const n={};R.forEach(r=>{const s=stat(r.label);n[s]=(n[s]||0)+1});$('sum').textContent=(n.labeled||0)+' named · '+(n.provisional||0)+' provisional · '+(n.unlabeled||0)+' unlabeled · '+(n.not_guest||0)+' not guests · '+(n.merged||0)+' merged';}
async function post(u,b){const r=await (await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();return r}
function row(c){return R.find(r=>r.cid===c)}
async function setName(c,v){v=v.trim();if(!v){return clearL(c)}const g=G.find(x=>x.name.toLowerCase()===v.toLowerCase());
 const l=g?{status:'labeled',name:g.name,first:g.first,last:g.last,email:g.email,party:g.party,guest_id:g.id}:{status:'labeled',name:v,first:v.split(' ')[0],last:v.split(' ').slice(1).join(' '),email:'',party:'',guest_id:null};
 await post('/api/label',{cid:c,...l});row(c).label=l;render();msg(g?'Saved: '+g.name+(g.email?' · '+g.email:''):'Saved custom name (not on guest list): '+v)}
async function notGuest(c){await post('/api/label',{cid:c,status:'not_guest'});row(c).label={status:'not_guest'};render();msg('#'+c+' marked not a guest')}
async function clearL(c){await post('/api/label',{cid:c,clear:true});row(c).label={};render();msg('#'+c+' cleared')}
async function confirmL(c){const l={...row(c).label};delete l.provisional;await post('/api/label',{cid:c,...l});row(c).label=l;render();msg('#'+c+' confirmed')}
$('undo').onclick=async()=>{const r=await post('/api/undo',{});if(!r.ok)return msg(r.msg);const x=row(r.cid);if(x)x.label=r.restored||{};render();msg('Undid change to #'+r.cid)};
$('imp').onclick=()=>$('file').click();$('file').onchange=async e=>{const t=await e.target.files[0].text();const r=await post('/api/import',{csv:t});msg('Imported '+r.n+' rows');load()};
$('filters').onclick=e=>{if(!e.target.dataset.f)return;filter=e.target.dataset.f;[...$('filters').children].forEach(b=>b.classList.toggle('on',b===e.target));render()};
$('q').oninput=render;document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{if(sortK===th.dataset.k)sortD*=-1;else{sortK=th.dataset.k;sortD=th.dataset.k==='photos'?-1:1}document.querySelectorAll('th').forEach(t=>t.classList.remove('s'));th.classList.add('s');render()});
function lb(src){$('lbimg').src=src.replace(/_\d+\.jpg$/,'');$('lb').classList.add('on')}
load();
</script></body></html>
