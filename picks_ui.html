<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Our picks — Wedding Wrapped</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1a1a19;--muted:#6b6963;--line:#e4e1d8;--acc:#b8862b;--rose:#c8462f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center}
h1{font-size:16px;margin:0;font-weight:600}.sum{color:var(--muted);font-size:13px}
button{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:16px 20px;max-width:1700px;margin:0 auto}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
figure{margin:0;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel);cursor:pointer}
figure img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
figure.on{outline:4px solid var(--acc)}figure .n{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:none;align-items:center;justify-content:center}
figure.on .n{display:flex}figcaption{padding:5px 9px;font-size:11px;color:var(--muted)}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none}
</style></head><body>
<header><h1>Our picks</h1><span class=sum id=sum></span><span class=sum>click to select — order = click order, shown on every guest's deck (aim for ~10)</span>
<button class=pri id=save>Save</button><a href="/" style="margin-left:auto;color:var(--acc);font-size:13px">← app</a></header>
<main><div class=g id=g></div></main><div id=msg></div>
<script>
const $=id=>document.getElementById(id);let sel=[];
const EVN={"GREH SHANTI":"Greh Shanti",HALDI:"Haldi",SANGEET:"Sangeet",WEDDING:"Wedding","RECEPTION PARTY":"Reception","RECEPTION COUPLE":"Reception portraits","BRIDE MORNING":"Bride morning","GROOM MORNING":"Groom morning","COUPLE SHOOT":"Couple shoot"};
function msg(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(m.t);m.t=setTimeout(()=>m.style.display='none',2000)}
function paint(){document.querySelectorAll('figure').forEach(f=>{const i=sel.indexOf(f.dataset.p);f.classList.toggle('on',i>=0);f.querySelector('.n').textContent=i+1});$('sum').textContent=sel.length+' selected'}
async function init(){const d=await (await fetch('/api/ourpicks')).json();sel=d.selected;
 $('g').innerHTML=d.candidates.map(c=>'<figure data-p="'+c.photo_id+'"><img loading=lazy src="'+c.url+'"><span class=n></span><figcaption>'+(EVN[c.gallery]||c.gallery)+' · '+c.t+' · '+c.nf+' faces</figcaption></figure>').join('');
 document.querySelectorAll('figure').forEach(f=>f.onclick=()=>{const p=f.dataset.p;const i=sel.indexOf(p);if(i>=0)sel.splice(i,1);else sel.push(p);paint()});paint()}
$('save').onclick=async()=>{const r=await (await fetch('/api/ourpicks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photo_ids:sel})})).json();msg('Saved '+r.n+' picks — rebuild + redeploy to publish')};
init();
</script></body></html>
