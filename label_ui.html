<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Name the faces — Wedding Wrapped</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1a1a19;--muted:#6b6963;--line:#e4e1d8;--acc:#b8862b;--ok:#1b8f5a;--warn:#c8462f;--hi:#fff4d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:600}.prog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.hint{color:var(--muted);font-size:12px}
main{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px 18px;max-width:1500px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.top h2{margin:0;font-size:20px}.top .meta{color:var(--muted);font-size:13px}
.ev span{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:2px 9px;margin:6px 6px 0 0;font-size:12px}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:12px}.faces img{width:100%;aspect-ratio:1;border-radius:6px;display:block;object-fit:cover;cursor:zoom-in}.ctx figure{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:50;align-items:center;justify-content:center}#lb.on{display:flex}#lb .w{position:relative}#lb img{max-width:96vw;max-height:94vh;display:block}#lb .bx{position:absolute;border:3px solid #f2c14e;border-radius:4px;box-shadow:0 0 0 2px rgba(0,0,0,.5)}#lb .cap{position:absolute;left:0;bottom:-26px;color:#ddd;font-size:13px}#lb .x{position:absolute;top:14px;right:18px;color:#fff;font-size:28px;cursor:pointer}
.ctx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.ctx figure{margin:0;position:relative;border-radius:6px;overflow:hidden;background:#000;aspect-ratio:3/2}.ctx img{width:100%;height:100%;object-fit:contain;display:block}
.ctx .box{position:absolute;border:2px solid #f2c14e;box-shadow:0 0 0 2px rgba(0,0,0,.4);border-radius:3px}
.ctx figcaption{position:absolute;left:6px;bottom:4px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:4px 10px 4px 4px;font-size:13px}.chip img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.chip.sim{cursor:pointer}.chip.sim:hover{border-color:var(--acc)}.chip small{color:var(--muted)}
input[type=search]{width:100%;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:8px;outline:none}input[type=search]:focus{border-color:var(--acc)}
.sug{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.sug li{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}.sug li:last-child{border-bottom:0}
.sug li.hi{background:var(--hi)}.sug small{color:var(--muted);font-size:12px}.sug .used{color:var(--warn);font-size:11px}.sug .fit{color:var(--ok);font-size:11px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;padding:9px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}button:hover{border-color:var(--acc)}kbd{font:11px ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;color:var(--muted)}
.status{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:13px;background:var(--bg)}.status.ok{background:#e6f5ec;color:#125c3a}.status.no{background:#fbe9e5;color:#7a2416}
.strip{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.strip img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:3px solid var(--line);cursor:pointer;opacity:.9}.strip img.done{border-color:var(--ok)}.strip img.no{border-color:var(--warn)}.strip img.cur{outline:3px solid var(--acc);outline-offset:1px}
</style></head><body>
<header><h1>Name the faces</h1><a class=hint href="/people" style="color:#b8862b">people table</a><a class=hint href="/review" style="color:#b8862b">review</a><div class=prog><i id=prog></i></div><span id=count class=hint></span><span class=hint>Enter assign · ↑↓ pick · ⌘→ skip · ⌘← back · ⌘. not a guest · ⌘/ merge · ⌘⌫ clear</span></header>
<main>
<section class=card id=left>
 <div class=top><h2 id=title>#—</h2><div class=meta id=meta></div></div>
 <div class=ev id=events></div>
 <div class=faces id=faces></div>
 <h3>In context</h3><div class=ctx id=ctx></div>
 <h3>Photographed with</h3><div class=row id=costars></div>
 <h3>Similar clusters (same person split?)</h3><div class=row id=similar></div>
</section>
<aside class=card>
 <input type=search id=q placeholder="Type a name from the guest list…" autocomplete=off>
 <ul class=sug id=sug></ul>
 <div class=btns><button class=pri id=bAssign>Assign<kbd>↵</kbd></button><button id=bSkip>Skip<kbd>⌘→</kbd></button><button id=bNo>Not a guest<kbd>⌘.</kbd></button><button id=bClear>Clear</button></div>
 <div class=status id=status></div>
 <h3>Guest list</h3><div class=hint id=gsum></div>
</aside>
<div class=strip id=strip></div>
</main>
<div id=lb onclick="closeLb()"><span class=x>×</span><div class=w><img id=lbimg><div class=bx id=lbbx></div><div class=cap id=lbcap></div></div></div>
<script>
let ST, i=0, cur=null, sel=0, sugs=[];
const $=id=>document.getElementById(id);
const EVN={"GREH SHANTI":"Greh Shanti",HALDI:"Haldi",SANGEET:"Sangeet",WEDDING:"Wedding","RECEPTION PARTY":"Reception","RECEPTION COUPLE":"Reception (couple)","BRIDE MORNING":"Bride morning","GROOM MORNING":"Groom morning","COUPLE SHOOT":"Couple shoot"};
const RSVP={"GREH SHANTI":"GREH SHANTI",HALDI:"HALDI",SANGEET:"SANGEET",WEDDING:"WEDDING","RECEPTION PARTY":"RECEPTION PARTY","RECEPTION COUPLE":"RECEPTION PARTY","BRIDE MORNING":"WEDDING","GROOM MORNING":"WEDDING","COUPLE SHOOT":"WEDDING"};
async function load(){ST=await (await fetch('/api/state')).json(); const want=+new URLSearchParams(location.search).get('cid'); const first=ST.queue.findIndex(c=>!ST.labels[c]); i=want&&ST.queue.includes(want)?ST.queue.indexOf(want):(first<0?0:first); renderStrip(); show();}
function used(){const m={};for(const [c,l] of Object.entries(ST.labels)) if(l.guest_id!=null) (m[l.guest_id]=m[l.guest_id]||[]).push(+c); return m;}
function renderStrip(){const s=$('strip'); s.innerHTML=''; ST.queue.forEach((c,k)=>{const im=document.createElement('img'); im.dataset.c=c; im.title='#'+c+' · '+ST.photos[c]+' photos'; im.loading='lazy'; im.src='/api/face?cid='+c; s.appendChild(im);}); updStrip();}
function updStrip(){[...$('strip').children].forEach((im,k)=>{const l=ST.labels[ST.queue[k]]; im.className=(l?(l.status==='not_guest'?'no':'done'):'')+(k===i?' cur':'')}); const done=ST.queue.filter(c=>ST.labels[c]).length; $('prog').style.width=100*done/ST.queue.length+'%'; $('count').textContent=done+' / '+ST.queue.length;}
async function show(){cur=await (await fetch('/api/cluster?cid='+ST.queue[i])).json(); const l=cur.label;
 $('title').textContent='#'+cur.cid; $('meta').textContent=cur.photos+' photos · '+(i+1)+' of '+ST.queue.length;
 $('events').innerHTML=Object.entries(cur.events).map(([e,n])=>'<span>'+(EVN[e]||e)+' · '+n+'</span>').join('');
 $('faces').innerHTML=cur.faces.map((f,k)=>'<img src="'+f.crop+'" title="click to see the full photo" onclick="lb('+k+')">').join('');
 $('ctx').innerHTML=cur.context.map((c,k)=>'<figure onclick="lbc('+k+')"><img src="'+c.url+'" data-k="'+k+'" onload="box(this)"><figcaption>'+(EVN[c.gallery]||c.gallery)+'</figcaption></figure>').join('');
 $('costars').innerHTML=cur.costars.map(c=>'<div class=chip><img src="'+c.face+'">'+(c.name?'<b>'+c.name+'</b>':'#'+c.cid)+'<small>'+c.n+'</small></div>').join('')||'<span class=hint>—</span>';
 $('similar').innerHTML=cur.similar.map(s=>'<div class="chip sim" onclick="merge('+s.cid+')" title="merge #'+cur.cid+' into #'+s.cid+'"><img src="'+s.face+'">'+(s.name?'<b>'+s.name+'</b>':'#'+s.cid)+'<small>'+s.photos+' · sim '+s.sim+'</small></div>').join('')||'<span class=hint>none above 0.35</span>';
 const st=$('status'); if(!l){st.className='status';st.textContent='Unlabeled';} else if(l.status==='not_guest'){st.className='status no';st.textContent='Marked: not a guest (vendor / staff / priest)';} else if(l.status==='merged'){st.className='status ok';st.textContent='Merged into #'+l.merge_into;} else {st.className='status ok';st.textContent='Labeled: '+l.name+(l.email?' · '+l.email:'')+(l.provisional?' (provisional — press Enter to confirm)':'');}
 $('q').value=l&&l.name&&l.status!=='not_guest'?l.name:''; sel=0; suggest(); $('q').focus(); updStrip(); const s=$('strip').children[i]; s&&s.scrollIntoView({block:'nearest'});
 $('gsum').textContent=Object.keys(used()).length+' of '+ST.guests.length+' guests placed';}
function lb(k){openLb(cur.faces[k].photo,cur.faces[k].box,cur.faces[k].gallery)}
function lbc(k){openLb(cur.context[k].url,cur.context[k].box,cur.context[k].gallery)}
function openLb(url,b,g){const im=$('lbimg');im.onload=()=>{const sx=im.clientWidth/im.naturalWidth,sy=im.clientHeight/im.naturalHeight;const x=$('lbbx');x.style.left=(b[0]*sx)+'px';x.style.top=(b[1]*sy)+'px';x.style.width=((b[2]-b[0])*sx)+'px';x.style.height=((b[3]-b[1])*sy)+'px'};im.src=url;$('lbcap').textContent=(EVN[g]||g)+' · '+decodeURIComponent(url.split('/').pop());$('lb').classList.add('on')}
function closeLb(){$('lb').classList.remove('on')}
function box(img){const c=cur.context[+img.dataset.k]; const f=img.parentElement; const sx=img.clientWidth/img.naturalWidth, sy=img.clientHeight/img.naturalHeight; const ox=(f.clientWidth-img.clientWidth)/2, oy=(f.clientHeight-img.clientHeight)/2;
 const b=document.createElement('div'); b.className='box'; b.style.left=(ox+c.box[0]*sx)+'px'; b.style.top=(oy+c.box[1]*sy)+'px'; b.style.width=((c.box[2]-c.box[0])*sx)+'px'; b.style.height=((c.box[3]-c.box[1])*sy)+'px'; f.appendChild(b);}
function suggest(){const q=$('q').value.trim().toLowerCase(); const U=used(); const evs=new Set(Object.keys(cur.events).map(e=>RSVP[e]));
 sugs=ST.guests.map(g=>{const n=g.name.toLowerCase(); let s=0; if(q){ if(n.startsWith(q)) s+=6; else if(n.split(' ').some(w=>w.startsWith(q))) s+=4; else if(n.includes(q)) s+=2; else return null; }
   const fit=[...evs].filter(e=>g.events[e]).length; s+=fit; if(!U[g.id]) s+=1.5; return {g,s,fit,usedBy:U[g.id]};}).filter(Boolean).sort((a,b)=>b.s-a.s||a.g.name.localeCompare(b.g.name)).slice(0,8);
 sel=Math.min(sel,Math.max(0,sugs.length-1));
 $('sug').innerHTML=sugs.map((x,k)=>'<li class="'+(k===sel?'hi':'')+'" onclick="sel='+k+';assign()"><span>'+x.g.name+(x.g.email?' <small>'+x.g.email+'</small>':'')+'</span><span>'+(x.usedBy?'<span class=used>already #'+x.usedBy.join(',#')+'</span> ':'')+(x.fit?'<span class=fit>'+x.fit+' events match</span>':'')+'</span></li>').join('');}
async function post(b){await fetch('/api/label',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});}
async function assign(){const x=sugs[sel]; if(!x) return; const g=x.g; ST.labels[cur.cid]={status:'labeled',name:g.name,first:g.first,last:g.last,email:g.email,party:g.party,guest_id:g.id};
 await post({cid:cur.cid,...ST.labels[cur.cid]}); next();}
async function notGuest(){ST.labels[cur.cid]={status:'not_guest'}; await post({cid:cur.cid,status:'not_guest'}); next();}
async function merge(into){const tgt=ST.labels[into]; ST.labels[cur.cid]=tgt&&tgt.status==='labeled'?{...tgt}:{status:'merged',merge_into:into}; await post({cid:cur.cid,...ST.labels[cur.cid]}); next();}
async function clear(){delete ST.labels[cur.cid]; await post({cid:cur.cid,clear:true}); show();}
function next(){updStrip(); const n=ST.queue.findIndex((c,k)=>k>i&&!ST.labels[c]); i=n<0?Math.min(i+1,ST.queue.length-1):n; show();}
$('q').oninput=()=>{sel=0;suggest()};
document.onkeydown=e=>{if($('lb').classList.contains('on')){if(e.key==='Escape')closeLb();return;}
 const mod=e.metaKey||e.ctrlKey;
 if(e.key==='Enter'){e.preventDefault();assign();return;}
 if(e.key==='ArrowDown'&&!mod){e.preventDefault();sel=Math.min(sel+1,sugs.length-1);suggest();return;}
 if(e.key==='ArrowUp'&&!mod){e.preventDefault();sel=Math.max(sel-1,0);suggest();return;}
 if(!mod)return;                       // plain letters always type into the search box
 if(e.key==='ArrowRight'){e.preventDefault();next();}
 else if(e.key==='ArrowLeft'){e.preventDefault();i=Math.max(i-1,0);show();}
 else if(e.key==='.'){e.preventDefault();notGuest();}
 else if(e.key==='/'){e.preventDefault();if(cur.similar[0])merge(cur.similar[0].cid);}
 else if(e.key==='Backspace'){e.preventDefault();clear();}};
$('bAssign').onclick=assign;$('bSkip').onclick=next;$('bNo').onclick=notGuest;$('bClear').onclick=clear;
$('strip').onclick=e=>{if(e.target.dataset.c){i=ST.queue.indexOf(+e.target.dataset.c);show();}};
load();
</script></body></html>
